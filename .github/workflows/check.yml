          echo "$out" | grep -q '^ok '
      - name: supabase/checks/setup-repair.sql (every line ok)
        run: |
          out=$(psql "$DB" -v ON_ERROR_STOP=1 -qtA -f supabase/checks/setup-repair.sql)
          echo "$out"
          bad=$(echo "$out" | grep -v '^$' | grep -v '^ok ' || true)
          [ -z "$bad" ] || { echo "::error::not every check passed: $bad"; exit 1; }
          echo "$out" | grep -q '^ok '
      - name: supabase/checks/usage-events.sql
        run: psql "$DB" -v ON_ERROR_STOP=1 -qtA -f supabase/checks/usage-events.sql | tee out.txt && grep -q 'all passed' out.txt
      - name: Two owners demoting each other at once leave one owner
        run: bash supabase/checks/last-owner-race.sh
