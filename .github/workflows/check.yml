          [ -z "$bad" ] || { echo "::error::not every check passed: $bad"; exit 1; }
          echo "$out" | grep -q '^ok '
      - name: supabase/checks/allowed-domains.sql (every line ok)
        run: |
          out=$(psql "$DB" -v ON_ERROR_STOP=1 -qtA -f supabase/checks/allowed-domains.sql)
          echo "$out"
