          echo "$out" | grep -q '^ok '
      - name: supabase/checks/space-rename.sql (every line ok)
        run: |
          out=$(psql "$DB" -v ON_ERROR_STOP=1 -qtA -f supabase/checks/space-rename.sql)
          echo "$out"
          bad=$(echo "$out" | grep -v '^$' | grep -v '^ok ' || true)
          [ -z "$bad" ] || { echo "::error::not every check passed: $bad"; exit 1; }
          echo "$out" | grep -q '^ok '
      - name: supabase/checks/space-symbol.sql (every line ok)
        run: |
          out=$(psql "$DB" -v ON_ERROR_STOP=1 -qtA -f supabase/checks/space-symbol.sql)
          echo "$out"
