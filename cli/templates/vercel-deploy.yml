# Deploys this twin to Vercel. Written by `miso init --runtime vercel`; the org owns the copy.
#
# CI builds one exact thing: the Tamari release pinned in .miso/miso.yaml (`version:`) plus the
# spaces in .miso/spaces/. Nobody deploys a working tree.
#
#   push to main    -> production (built, answers a request, then gets the live address)
#   pull request    -> preview (uses the real database; teammates need a Vercel login)
#   run by hand     -> production again for a commit on main (a re-run or a rollback)
#
# Moving to a new shell release is `miso update` (it rewrites `version:`), a pull request and a merge.
#
# Secrets (repository settings, Secrets and variables, Actions):
#   MISO_SHELL_TOKEN    read-only access to the shell repo, which is private. A fine-grained token
#                       whose resource owner is the shell repo's owner, limited to that repo, with
#                       Repository permissions: Contents = Read-only (Metadata is added for you).
#                       The workflow's own GITHUB_TOKEN can't read another private repo.
#   VERCEL_TOKEN        a Vercel token for the account or team that owns the project
#   VERCEL_ORG_ID       the team (or account) id, from .vercel/project.json after `vercel link`
#   VERCEL_PROJECT_ID   the project id, from the same file
# Variable (optional): VERCEL_SCOPE, the team slug, if `vercel` asks for one.
#
# The app's own settings (SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, SUPABASE_SECRET_KEY) are
# environment variables of the Vercel project, not secrets here. docs/org-repos.md has the list.
name: Deploy

on:
  push:
    branches: [main]
    paths: ['.miso/**', '.github/workflows/miso-deploy.yml']
  pull_request:
    paths: ['.miso/**', '.github/workflows/miso-deploy.yml']
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to release (a SHA or branch; must be on main)
        default: main
        required: true

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('preview-{0}', github.ref) || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          # Otherwise this repo's token rides along as a git header and overrides MISO_SHELL_TOKEN.
          persist-credentials: false
      - name: Check the commit is on main
        if: github.event_name == 'workflow_dispatch'
        env:
          TOKEN: ${{ github.token }}
        run: |
          git fetch -q "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git" main
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::$(git rev-parse --short HEAD) is not on main. Merge it first."
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # Bun's package cache. Packages are content-addressed, so a stale restore only means more to download.
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('.miso/miso.yaml', '.miso/spaces/**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # The `miso` command lives in the shell, so the shell is fetched first, at the pinned tag.
      - name: Fetch the pinned shell
        id: pin
        env:
          MISO_SHELL_TOKEN: ${{ secrets.MISO_SHELL_TOKEN }}
        run: |
          repo=$(sed -n 's/^shell: *\([^ #]*\).*/\1/p' .miso/miso.yaml)
          tag=$(sed -n 's/^version: *\([^ #]*\).*/\1/p' .miso/miso.yaml)
          if [ -z "$repo" ] || [ -z "$tag" ] || [ "$tag" = none ]; then
            echo "::error::.miso/miso.yaml needs a shell: and a version: (run \`miso update\` and commit it)."
            exit 1
          fi
          if [ -z "$MISO_SHELL_TOKEN" ]; then
            echo "::error::The secret MISO_SHELL_TOKEN is not set. The shell repo $repo is private: add a read-only token for it (see the top of this file)."
            exit 1
          fi
          auth=$(printf 'x-access-token:%s' "$MISO_SHELL_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            clone --quiet --depth 1 --branch "$tag" "https://github.com/$repo.git" .miso/vercel
          echo "shell=$repo" >> "$GITHUB_OUTPUT"
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      # Puts the org's spaces into the shell as real files and builds it: the gate. It writes dist/
      # (the client) and api/_generated/ (the API with every space's server functions).
      - name: Prepare and build
        env:
          MISO_SHELL_TOKEN: ${{ secrets.MISO_SHELL_TOKEN }}
        run: bun .miso/vercel/cli/miso.ts vercel prepare --build
      - run: bun run typecheck
        working-directory: .miso/vercel
      - name: Deploy
        id: deploy
        # A fork's pull request has no secrets: the gate above still runs, the deploy is skipped.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        working-directory: .miso/vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
          SHELL_VERSION: ${{ steps.pin.outputs.version }}
          PROD: ${{ github.event_name != 'pull_request' }}
        run: |
          sha=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)
          vercel() { bunx vercel@62.1.0 "$@"; }
          scope=()
          [ -n "$VERCEL_SCOPE" ] && scope=(--scope "$VERCEL_SCOPE")
          flags=("${scope[@]}" --meta githubCommitSha="$sha" --meta githubCommitRef="$GITHUB_REF_NAME" --meta shellVersion="$SHELL_VERSION")
          # Production is built with production's environment but is not given the live address
          # until it has answered a request (below), so a broken build never replaces a working one.
          [ "$PROD" = true ] && flags+=(--prod --skip-domain)
          url=$(vercel deploy "${flags[@]}")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          # Smoke test: the API must start and hand out its config. `vercel curl` gets through
          # deployment protection with the token.
          body=$(vercel curl "$url/api/config" "${scope[@]}")
          echo "$body" | grep -q '"supabaseUrl"' || { echo "::error::$url/api/config did not return the app config: $body"; exit 1; }
          if [ "$PROD" = true ]; then
            vercel promote "$url" "${scope[@]}" --yes
            echo "Production: $url (twin ${sha::7}, shell $SHELL_VERSION)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Preview: $url (twin ${sha::7}, shell $SHELL_VERSION)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Comment the preview URL
        if: github.event_name == 'pull_request' && steps.deploy.outputs.url
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body "Preview for ${GITHUB_SHA::7}: $URL. It uses the real database. Teammates need a Vercel login to open it."
